name: clouddrive
x-app: &app
  build: .
  environment: &environment
    CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive
    CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
    CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
    CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:9000
    CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
    CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }
  restart: unless-stopped

services:
  api:
    <<: *app
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "clouddrive.worker:celery",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    depends_on:
      api: { condition: service_healthy }
  beat:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "clouddrive.worker:celery",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      api: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      {
        POSTGRES_USER: clouddrive,
        POSTGRES_PASSWORD: clouddrive,
        POSTGRES_DB: clouddrive,
      }
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddrive"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6382:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    build: { context: ., dockerfile: Dockerfile.minio }
    image: clouddrive-minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: clouddrive
      MINIO_ROOT_PASSWORD: clouddrive-local
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8090,http://127.0.0.1:8090,http://localhost:5173,http://127.0.0.1:5173
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
  object-data:
