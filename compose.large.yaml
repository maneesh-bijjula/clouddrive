# Dedicated disk-backed large-file tests; no normal workspace volumes.
name: clouddrive-large-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clouddrive
      POSTGRES_PASSWORD: clouddrive
      POSTGRES_DB: clouddrive_large_test
    ports:
      - 127.0.0.1:15437:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U clouddrive
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - large-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:16384:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: clouddrive-minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: clouddrive
      MINIO_ROOT_PASSWORD: clouddrive-local
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:18091,http://127.0.0.1:18091
    ports:
      - 127.0.0.1:19011:9000
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - large-object-data:/data
  api:
    image: clouddrive:large-test
    build:
      context: .
    environment:
      CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive_large_test
      CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
      CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
      CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:19011
      CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
      CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
      CLOUDDRIVE_S3_BUCKET: clouddrive-large-test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - 127.0.0.1:18091:8090
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')
      interval: 3s
      timeout: 5s
      retries: 20
  worker:
    image: clouddrive:large-test
    environment:
      CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive_large_test
      CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
      CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
      CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:19011
      CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
      CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
      CLOUDDRIVE_S3_BUCKET: clouddrive-large-test
    depends_on:
      api:
        condition: service_healthy
    command:
      - celery
      - -A
      - clouddrive.worker:celery
      - worker
      - --loglevel=INFO
      - --concurrency=2
  beat:
    image: clouddrive:large-test
    environment:
      CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive_large_test
      CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
      CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
      CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:19011
      CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
      CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
      CLOUDDRIVE_S3_BUCKET: clouddrive-large-test
    depends_on:
      api:
        condition: service_healthy
    command:
      - celery
      - -A
      - clouddrive.worker:celery
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/clouddrive-large-beat
volumes:
  large-postgres-data: {}
  large-object-data: {}
