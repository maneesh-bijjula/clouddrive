name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Formatting and frontend build
        run: |
          python -m black --check clouddrive tests scripts
          npx prettier --check frontend tests-browser *.json *.ts .github docs/*.md README.md compose*.yaml
          npm run build
      - name: Start isolated infrastructure
        run: docker compose -f compose.test.yaml up -d --build --wait
      - name: Unit and integration tests
        run: python -m pytest --integration --junitxml=test-results/python.xml -q
      - run: npx playwright install --with-deps chromium
      - name: Browser tests with actual Celery worker and scheduler
        run: npm run test:browser
      - name: Build application image
        run: docker build -t clouddrive:ci .
      - name: Infrastructure logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.test.yaml logs --no-color > test-results/infrastructure.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose -f compose.test.yaml down
