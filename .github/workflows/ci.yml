name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Formatting and frontend build
        run: |
          python -m black --check clouddrive tests scripts
          npx prettier --check frontend tests-browser *.json *.ts .github docs/*.md docs/*.json README.md compose*.yaml scripts/*.mjs
          npm run build
          docker compose -f compose.yaml config --quiet
          node --test scripts/load-observer.test.mjs scripts/load-file-hash.test.mjs
      - name: Start isolated infrastructure
        run: docker compose -f compose.test.yaml up -d --build --wait
      - name: Unit and integration tests
        run: python -m pytest --integration --junitxml=test-results/python.xml -q
      - run: npx playwright install --with-deps chromium
      - name: Browser tests with actual Celery worker and scheduler
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/host
        run: npm run test:browser
      - name: Build and start packaged application in a separate test project
        run: |
          docker compose -f compose.verify.yaml build api
          docker compose -f compose.verify.yaml up -d --wait
      - name: Browser regressions against the packaged API and workers
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:18090
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/packaged
          CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@localhost:15436/clouddrive_verify_test
          CLOUDDRIVE_S3_ENDPOINT: http://localhost:19010
          CLOUDDRIVE_S3_BUCKET: clouddrive-verify-test
        run: npm run test:browser -- --output=test-results/packaged
      - name: Infrastructure logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f compose.test.yaml logs --no-color > test-results/infrastructure.log
          docker compose -f compose.verify.yaml logs --no-color > test-results/packaged-infrastructure.log
      - name: Release ordinary test stacks before the bounded load smoke
        run: |
          docker compose -f compose.verify.yaml down
          docker compose -f compose.test.yaml down
      - name: Start isolated HTTP2 load profile
        run: |
          docker compose -p clouddrive-ci-load -f compose.load.yaml build api
          docker compose -p clouddrive-ci-load -f compose.load.yaml pull postgres redis gateway
          docker compose -p clouddrive-ci-load -f compose.load.yaml up --no-build --pull never -d --wait
      - name: Ten-file concurrency smoke (small fixtures; not 500 MB evidence)
        env:
          CLOUDDRIVE_TEST_PYTHON: python
        run: |
          mkdir -p test-results/load
          set -o pipefail
          npm run bench:concurrent -- --bytes 16777233 --runs 1 --project clouddrive-ci-load --output test-results/load/smoke.json 2>&1 | tee test-results/load/transcript.txt
      - name: Isolated load service state (exclude signed-URL gateway logs)
        if: always()
        run: |
          mkdir -p test-results/load
          docker compose -p clouddrive-ci-load -f compose.load.yaml ps --all > test-results/load/services.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
      - name: Stop test services
        if: always()
        run: |
          docker compose -p clouddrive-ci-load -f compose.load.yaml down -v --remove-orphans
          docker compose -f compose.verify.yaml down
          docker compose -f compose.test.yaml down
