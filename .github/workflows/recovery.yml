name: Named recovery matrix
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      passes:
        description: Complete 20-case passes (three required for release evidence)
        type: choice
        options: ["1", "3"]
        default: "3"
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start only the isolated recovery stack
        run: |
          mkdir -p test-results/recovery-control
          chmod 777 test-results/recovery-control
          docker compose -p clouddrive-ci-recovery -f compose.recovery.yaml up --build -d --wait
      - name: Execute each named case once per full pass, without runner retries
        env:
          RECOVERY_PASSES: ${{ inputs.passes || '1' }}
        run: |
          set -o pipefail
          npm run test:recovery -- --project clouddrive-ci-recovery --passes "$RECOVERY_PASSES" --output test-results/recovery/matrix.json 2>&1 | tee test-results/recovery-transcript.txt
      - name: Isolated stack diagnostics
        if: always()
        run: |
          mkdir -p test-results/recovery
          docker compose -p clouddrive-ci-recovery -f compose.recovery.yaml logs --no-color > test-results/recovery/stack.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recovery-evidence
          path: |
            test-results/recovery
            test-results/recovery-transcript.txt
          retention-days: 30
      - name: Remove only disposable recovery containers and volumes
        if: always()
        run: docker compose -p clouddrive-ci-recovery -f compose.recovery.yaml down -v --remove-orphans
