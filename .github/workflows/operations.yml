name: Backup and restore verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline archive and fresh isolated project restore
        run: python scripts/verify-restore.py --output test-results/operations/results.json
      - name: Record isolated service identities without request logs or private archives
        if: always()
        run: |
          mkdir -p test-results/operations
          docker ps --filter label=com.docker.compose.project=clouddrive-ci-ops-source --format '{{.Image}} {{.Status}}' > test-results/operations/source-services.txt
          docker ps --filter label=com.docker.compose.project=clouddrive-ci-ops-target --format '{{.Image}} {{.Status}}' > test-results/operations/target-services.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: operations-evidence
          path: test-results/operations
          retention-days: 30
      - name: Remove only this job's disposable projects
        if: always()
        run: |
          docker compose -p clouddrive-ci-ops-source -f compose.operations.yaml down -v --remove-orphans
          docker compose -p clouddrive-ci-ops-target -f compose.operations.yaml down -v --remove-orphans
