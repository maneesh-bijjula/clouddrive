# Disposable recovery fault stack. Named test volumes survive injected outages.
name: clouddrive-sprint3-recovery
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clouddrive
      POSTGRES_PASSWORD: clouddrive
      POSTGRES_DB: clouddrive_recovery_test
    ports:
      - 127.0.0.1:15438:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U clouddrive
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recovery-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:16385:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recovery-redis:/data
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: clouddrive-minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: clouddrive
      MINIO_ROOT_PASSWORD: clouddrive-local
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:18092,http://127.0.0.1:18092
    ports:
      - 127.0.0.1:19012:9000
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - recovery-minio:/data
  api:
    image: clouddrive:recovery
    build:
      context: .
    environment:
      CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive_recovery_test
      CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
      CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
      CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:19012
      CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
      CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
      CLOUDDRIVE_S3_BUCKET: clouddrive-recovery-test
      CLOUDDRIVE_RECOVERY_CONTROL_DIR: /recovery-control
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - 127.0.0.1:18092:8090
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/api/health')
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ${CLOUDDRIVE_RECOVERY_CONTROL_DIR:-./test-results/recovery-control}:/recovery-control
  worker:
    image: clouddrive:recovery
    environment:
      CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive_recovery_test
      CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
      CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
      CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:19012
      CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
      CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
      CLOUDDRIVE_S3_BUCKET: clouddrive-recovery-test
      CLOUDDRIVE_RECOVERY_CONTROL_DIR: /recovery-control
    depends_on:
      api:
        condition: service_healthy
    command:
      - celery
      - -A
      - clouddrive.worker:celery
      - worker
      - --loglevel=INFO
      - --concurrency=1
    volumes:
      - ${CLOUDDRIVE_RECOVERY_CONTROL_DIR:-./test-results/recovery-control}:/recovery-control
  beat:
    image: clouddrive:recovery
    environment:
      CLOUDDRIVE_DATABASE_URL: postgresql+psycopg://clouddrive:clouddrive@postgres:5432/clouddrive_recovery_test
      CLOUDDRIVE_REDIS_URL: redis://redis:6379/0
      CLOUDDRIVE_S3_ENDPOINT: http://minio:9000
      CLOUDDRIVE_S3_PUBLIC_ENDPOINT: http://localhost:19012
      CLOUDDRIVE_S3_ACCESS_KEY: clouddrive
      CLOUDDRIVE_S3_SECRET_KEY: clouddrive-local
      CLOUDDRIVE_S3_BUCKET: clouddrive-recovery-test
      CLOUDDRIVE_RECOVERY_CONTROL_DIR: /recovery-control
    depends_on:
      api:
        condition: service_healthy
    command:
      - celery
      - -A
      - clouddrive.worker:celery
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/clouddrive-recovery-beat
    volumes:
      - ${CLOUDDRIVE_RECOVERY_CONTROL_DIR:-./test-results/recovery-control}:/recovery-control
volumes:
  recovery-postgres: {}
  recovery-redis: {}
  recovery-minio: {}
